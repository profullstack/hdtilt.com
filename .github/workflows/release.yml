name: Release
# Tag-driven: push vX.Y.Z (matching package.json) and this publishes the CLI to
# npm and attaches desktop installers to the GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Refuse a tag that disagrees with package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun web/build.js
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.dmg
            dist-desktop/*.exe
