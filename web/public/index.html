<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<title>hdtilt — open-source IPTV player</title>
<meta name="description" content="A free, open-source IPTV player for your own M3U or Xtream Codes playlist, with a TV guide. Runs in the browser, on the desktop and in the terminal.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script data-site="57f70d8d-51ae-44f6-8259-784027eb0f99" src="https://crawlproof.com/stats.js" async></script>
</head>
<body>
<div id="app">
  <video id="video" playsinline autoplay></video>
  <div id="stage-msg" class="stage-msg" hidden></div>
  <div id="clock" class="clock"></div>
  <div id="numentry" class="numentry" hidden></div>

  <!-- Channel banner: shown on every channel change, then fades. -->
  <section id="banner" class="banner" hidden>
    <div id="banner-info" class="banner-info" aria-live="polite"></div>
    <div id="controls" class="controls" role="toolbar" aria-label="Playback">
      <button type="button" data-c="play" aria-label="Pause"></button>
      <button type="button" data-c="mute" aria-label="Mute"></button>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <div class="seek" id="seekwrap" hidden><span id="t-cur">0:00</span><input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Position"><span id="t-dur">0:00</span></div>
      <span class="spacer"></span>
      <button type="button" data-c="pip" aria-label="Picture in picture"></button>
      <button type="button" data-c="fs" aria-label="Full screen"></button>
    </div>
  </section>

  <!-- Channel list: groups rail + channels. -->
  <section id="list" class="list" hidden>
    <nav id="groups" class="groups" aria-label="Groups"></nav>
    <div class="channels-wrap">
      <header id="list-head" class="list-head"></header>
      <div id="channels" class="channels" role="listbox" tabindex="-1"></div>
    </div>
  </section>

  <!-- TV guide. -->
  <section id="guide" class="guide" hidden>
    <header id="guide-info" class="guide-info"></header>
    <div class="guide-bar"><button type="button" class="close-btn" id="guide-close" aria-label="Close the guide">✕</button><button type="button" class="chip" id="gfav" aria-pressed="false">★ Favorites</button><input id="gq" class="filter" type="search" placeholder="Filter…" autocomplete="off" spellcheck="false" aria-label="Filter the guide"></div>
    <div id="guide-grid" class="guide-grid"></div>
  </section>

  <!-- Global nav: always there outside the picture, one press from it. -->
  <nav id="nav" class="nav" hidden aria-label="Main">
    <span class="brand"><img src="/icon.svg" alt="">hdtilt</span>
    <div class="nav-items">
      <button type="button" data-act="live">Live TV</button>
      <button type="button" data-act="guide">TV Guide</button>
      <button type="button" data-act="favs">★ Favorites</button>
      <button type="button" data-act="recent">Recent</button>
      <button type="button" data-act="account" id="nav-account">Sign in</button>
      <button type="button" data-act="settings" aria-label="Settings">⚙ Settings</button>
    </div>
  </nav>

  <!-- Setup and settings share one sheet. -->
  <section id="sheet" class="sheet" hidden></section>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
